<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jeopardy jrh - Licenciamiento Firestore y Control Móvil Instructor</title>
    <meta name="description" content="Juego interactivo Jeopardy Live Show con licenciamiento Firestore, roles docente/concursante, control móvil de instructor mediante QR y sincronización en tiempo real." />
    <meta property="og:title" content="Jeopardy jrh - Control Móvil Instructor" />
    <meta property="og:description" content="Juego interactivo Jeopardy Live Show con licenciamiento Firestore, roles docente/concursante, control móvil de instructor mediante QR y sincronización en tiempo real." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Cinzel:wght@700;900&family=Bebas+Neue&family=Teko:wght@600;700&display=swap" rel="stylesheet">

    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- SheetJS (xlsx) CDN for Excel processing -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- Firebase App, Firestore & Realtime Database CDN (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Control Estricto de Sesión y Limpieza de Pestaña para Instructor (Host) -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var role = params.get('role');
          var team = params.get('team');
          var isHost = (role !== 'instructor' && role !== 'player' && team === null);

          // 1. Limpieza preventiva al cargar o recargar pestaña para el instructor
          if (isHost) {
            var raw = localStorage.getItem('jeopardy_state');
            if (raw) {
              try {
                var state = JSON.parse(raw);
                state.status = 'setup';
                state.activeClue = null;
                state.currentTurn = null;
                state.buzzQueue = [];
                state.disqualifiedTeams = [];
                state.buzzersUnlocked = false;
                state.loadingDevicesState = true;
                if (Array.isArray(state.teams)) {
                  state.teams.forEach(function(t) { t.score = 0; });
                }
                if (Array.isArray(state.categories)) {
                  state.categories.forEach(function(cat) {
                    if (Array.isArray(cat.clues)) {
                      cat.clues.forEach(function(cl) { cl.isAnswered = false; });
                    }
                  });
                }
                localStorage.setItem('jeopardy_state', JSON.stringify(state));
              } catch (e) {
                localStorage.removeItem('jeopardy_state');
              }
            }
            try { sessionStorage.removeItem('jeopardy_screen_history'); } catch (e) {}
          }

          // 2. Detección de Cierre de Pestaña (beforeunload / pagehide)
          var handleTabExit = function() {
            var p = new URLSearchParams(window.location.search);
            var r = p.get('role');
            var t = p.get('team');
            if (r !== 'instructor' && r !== 'player' && t === null) {
              try {
                var cur = localStorage.getItem('jeopardy_state');
                if (cur) {
                  var data = JSON.parse(cur);
                  data.status = 'setup';
                  data.activeClue = null;
                  data.currentTurn = null;
                  data.buzzQueue = [];
                  data.disqualifiedTeams = [];
                  data.buzzersUnlocked = false;
                  data.loadingDevicesState = true;
                  if (Array.isArray(data.teams)) {
                    data.teams.forEach(function(item) { item.score = 0; });
                  }
                  if (Array.isArray(data.categories)) {
                    data.categories.forEach(function(cat) {
                      if (Array.isArray(cat.clues)) {
                        cat.clues.forEach(function(cl) { cl.isAnswered = false; });
                      }
                    });
                  }
                  localStorage.setItem('jeopardy_state', JSON.stringify(data));
                }
                sessionStorage.removeItem('jeopardy_screen_history');
              } catch (err) {}

              // Notificación a Firebase si está inicializado
              try {
                if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
                  var db = window.firebase.database();
                  if (db) {
                    db.ref('sessions/jeopardy_game').update({
                      status: 'setup',
                      activeClue: null,
                      activeTurn: null,
                      buzzQueue: null,
                      disqualifiedTeams: null,
                      buzzersUnlocked: false,
                      loadingDevicesState: true,
                      lastUpdated: Date.now()
                    });
                  }
                }
              } catch (fbErr) {}
            }
          };

          window.addEventListener('beforeunload', handleTabExit);
          window.addEventListener('pagehide', handleTabExit);
        } catch (globalErr) {
          console.warn('Session handler init notice:', globalErr);
        }
      })();
    </script>
  </head>
  <body class="bg-[#000533] text-white antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
